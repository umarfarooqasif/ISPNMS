name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/isp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Run tests (builds the schema from the real migrations)
        working-directory: backend
        run: python -m pytest

  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell script lint
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -x install.sh scripts/*.sh
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=x SECRET_KEY=x FIELD_ENCRYPTION_KEYS=x docker compose config --quiet
      - name: Backend image builds
        run: docker build ./backend
