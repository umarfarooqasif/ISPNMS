name: isp-billing

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: isp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: isp
      TZ: ${TIMEZONE:-Asia/Karachi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp -d isp"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    # Not published to the host: only other containers can reach the database.

  # One-shot: apply migrations, then seed roles/permissions (and the first admin on first run).
  migrate:
    build: ./backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://isp:${POSTGRES_PASSWORD}@postgres:5432/isp
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?set FIELD_ENCRYPTION_KEYS in .env}
      TIMEZONE: ${TIMEZONE:-Asia/Karachi}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *logging
    # Not published: reached only through the reverse proxy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
